<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start Exam</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #eef2f7;
            font-family: 'Segoe UI', sans-serif;
        }

        .navbar {
            background: linear-gradient(135deg, #0d6efd, #084298);
        }

        .question-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.12);
            overflow: hidden;
        }

        .card-header {
            background: linear-gradient(135deg, #0d6efd, #084298);
            color: white;
            font-size: 24px;
            font-weight: 600;
            text-align: center;
            padding: 18px;
        }

        .option-box {
            padding: 12px;
            border: 1px solid #dee2e6;
            border-radius: 10px;
            margin-bottom: 10px;
            transition: 0.3s;
        }

        .option-box:hover {
            background-color: #f8f9fa;
        }

        .question-no {
            font-size: 18px;
            font-weight: 600;
            color: #0d6efd;
        }

        .btn-custom {
            min-width: 140px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-dark">
        <div class="container">
            <span class="navbar-brand fw-bold">
                OAEP Examination Portal
            </span>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card question-card">
                    <div class="card-header">
                        Online Examination
                    </div>
                    <div>
                        {{msg}}
                    </div>

                    <div class="card-body p-4">
                        <form method="post">
                            {% csrf_token %}
                            <input type="hidden" name="qno" value="{{question.que_id}}">
                            <input type="hidden" name="que_name" value="{{question.que_name}}">
                            <input type="hidden" name="answer" value="{{question.correct_ans}}">
                            <input type="hidden" name="subject" value="{{question.sub_name}}">

                            <div class="question-box">
                                <p class="qtext"> {{question.que_name}}</p>
                                <div class="option-box">
                                    <input type="radio" name="op" value="{{question.option_1}}">
                                    {{question.option_1}}
                                </div>

                                <div class="option-box">
                                    <input type="radio" name="op" value="{{question.option_2}}">
                                    {{question.option_2}}
                                </div>

                                <div class="option-box">
                                    <input type="radio" name="op" value="{{question.option_3}}">
                                    {{question.option_3}}
                                </div>

                                <div class="option-box">
                                    <input type="radio" name="op" value="{{question.option_4}}">
                                    {{question.option_4}}
                                </div>
                                <div class="d-flex justify-content-between mt-5">

                                    {% if qno > 0 %}
                                    <button formaction="/previousquestion/" class="btn btn-warning px-4">
                                        ⬅ Previous
                                    </button>
                                    {% else %}
                                    <div></div>
                                    {% endif %}

                                    {% if qno < totalquestion|add:"-1" %} <button formaction="/nextquestion/"
                                        class="btn btn-primary px-4">
                                        Next ➡
                                        </button>

                                        {% else %}

                                        <button formaction="/endtest/" class="btn btn-danger px-4">
                                            End Exam
                                        </button>

                                        {% endif %}

                                </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
