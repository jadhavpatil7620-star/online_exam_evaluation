<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #eef2ff, #f8f9fa);
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
        }

        .navbar {
            background: linear-gradient(135deg, #0d6efd, #084298);
        }

        .page-title {
            text-align: center;
            margin-top: 40px;
            margin-bottom: 40px;
            font-weight: bold;
            color: #084298;
        }

        .crud-card {
            border: none;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0px 8px 20px rgba(0,0,0,0.12);
            transition: 0.3s;
        }

        .crud-card:hover {
            transform: translateY(-8px);
        }

        .card-body {
            text-align: center;
            padding: 35px;
        }

        .icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .btn-custom {
            width: 150px;
            border-radius: 10px;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                OAEP Admin Panel
            </a>
        </div>
    </nav>

    <!-- Page Title -->
    <div class="container">

        <h2 class="page-title">
            Student Management Dashboard
        </h2>

        <div class="row g-4">

            <!-- Add Student -->
            <div class="col-md-6 col-lg-3">
                <div class="card crud-card">
                    <div class="card-body">

                        <div class="icon">➕</div>

                        <h4>Add Student</h4>

                        <p>
                            Register a new student.
                        </p>

                        <a href="/studentregisterpage/"
                           class="btn btn-success btn-custom">
                            Add
                        </a>

                    </div>
                </div>
            </div>

            <!-- View Students -->
            <div class="col-md-6 col-lg-3">
                <div class="card crud-card">
                    <div class="card-body">

                        <div class="icon">👁️</div>

                        <h4>View Students</h4>

                        <p>
                            Show all registered students.
                        </p>

                        <a href="/viewstudentpage/"
                           class="btn btn-primary btn-custom">
                            View
                        </a>

                    </div>
                </div>
            </div>

            <!-- Update Student -->
            <div class="col-md-6 col-lg-3">
                <div class="card crud-card">
                    <div class="card-body">

                        <div class="icon">✏️</div>

                        <h4>Update Student</h4>

                        <p>
                            Modify student details.
                        </p>

                        <a href="/updatestudentpage/"
                           class="btn btn-warning btn-custom">
                            Update
                        </a>

                    </div>
                </div>
            </div>

            <!-- Delete Student -->
            <div class="col-md-6 col-lg-3">
                <div class="card crud-card">
                    <div class="card-body">

                        <div class="icon">🗑️</div>

                        <h4>Delete Student</h4>

                        <p>
                            Remove student records.
                        </p>

                        <a href="/deletestudentpage/"
                           class="btn btn-danger btn-custom">
                            Delete
                        </a>

                    </div>
                </div>
            </div>

        </div>

    </div>

</body>

</html>
