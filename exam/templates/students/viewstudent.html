<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User CRUD</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: #f4f6f9;
      }

      .register-card {
        max-width: 500px;
        margin: 50px auto;
        border-radius: 15px;
      }

      .navbar {
            background: linear-gradient(135deg, #0d6efd, #084298);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                OAEP Student Portal
            </a>
        </div>
    </nav>
    <div class="container">
      <div class="card shadow register-card">
        <div class="card-body p-4">
          <h2 class="text-center mb-4">View Student</h2>
          
          {% if msg %}
          <div class="alert alert-danger">{{ msg }}</div>
          {% endif %}

          <form method="post">
            {% csrf_token %}

            <div class="mb-3">
              <label class="form-label">Username</label>
              <input type="text" class="form-control" placeholder="Enter your Username" name="username" value="{{userdb.username}}"/>
            </div>

            <div class="mb-3">
              <label class="form-label">Email Address</label>
              <input type="email" class="form-control" placeholder="Enter your email" name="email" value="{{userdb.email}}"/>
            </div>

            <div class="mb-3">
              <label class="form-label">Mobile Number</label>
              <input type="tel" class="form-control" placeholder="Enter mobile number" name="mobile_no" value="{{userdb.mobile_no}}"/>
            </div>

            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" class="form-control" placeholder="Enter your password" name="password" value="{{userdb.password}}"/>
            </div>

            <div>
                <button type="submit" style="margin-left: 160px;" formaction="/viewstudent/" class="btn btn-primary btn-lg">
                  View User
                </button>
            </div>
          </form>
        </div>
      </div>
    </div>
</body>
</html>
