<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #e8f0ff, #f8f9fa);
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
        }

        .navbar {
            background: linear-gradient(135deg, #0d6efd, #084298);
        }

        .registration-card {
            border: none;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.12);
        }

        .card-header {
            background: linear-gradient(135deg, #0d6efd, #084298);
            color: white;
            text-align: center;
            font-size: 28px;
            font-weight: 600;
            padding: 20px;
        }

        .card-body {
            padding: 35px;
        }

        .form-label {
            font-weight: 600;
            color: #343a40;
        }

        .form-control,
        .form-select {
            border-radius: 12px;
            padding: 12px;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 8px rgba(13,110,253,.25);
        }

        .btn-register {
            width: 200px;
            height: 48px;
            border-radius: 12px;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                OAEP Student Portal
            </a>
        </div>
    </nav>

    <!-- Registration Form -->
    <div class="container mt-5 mb-5">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <div class="card registration-card">

                    <div class="card-header">
                        Student Registration
                    </div>

                    <div class="card-body">

                        <form method="post">
                            {% csrf_token %}

                            <div class="row">

                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Username</label>
                                    <input type="text" class="form-control" name="username"
                                        placeholder="Enter Username">
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Password</label>
                                    <input type="password" class="form-control" name="password"
                                        placeholder="Enter Ypur Password">
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Confarm Password</label>
                                    <input type="password" class="form-control" name="cfpassword"
                                        placeholder="Enter Conform Password">
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Email Address</label>
                                    <input type="email" class="form-control" name="email"
                                        placeholder="Enter Email">
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Mobile Number</label>
                                    <input type="tel" class="form-control" name="mobile_no"
                                        placeholder="Enter Mobile Number">
                                </div>

                            </div>

                            <div class="text-center mt-4">

                                <button type="submit" formaction="/studentregister/"
                                    class="btn btn-primary btn-register">
                                    Register Student
                                </button>

                                <button type="reset"
                                    class="btn btn-secondary btn-register">
                                    Reset
                                </button>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
