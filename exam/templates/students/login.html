<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #e8f0ff, #f8f9fa);
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
        }

        .navbar {
            background: linear-gradient(135deg, #0d6efd, #084298);
        }

        .login-card {
            border: none;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.12);
        }

        .card-header {
            background: linear-gradient(135deg, #0d6efd, #084298);
            color: white;
            text-align: center;
            padding: 25px;
        }

        .card-header h2 {
            margin: 0;
            font-weight: 600;
        }

        .card-body {
            padding: 35px;
        }

        .form-control {
            border-radius: 12px;
            padding: 12px;
        }

        .form-label {
            font-weight: 600;
        }

        .btn-login {
            width: 170px;
            border-radius: 12px;
            font-weight: 600;
        }

        .btn-register {
            width: 170px;
            border-radius: 12px;
            font-weight: 600;
        }

        .portal-title {
            text-align: center;
            margin-bottom: 25px;
            color: #084298;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">
                OAEP Student Portal
            </a>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center align-items-center vh-100">
            <div class="col-md-5">
                <h2 class="portal-title">
                    Online Assessment & Evaluation Portal
                </h2>
                <div class="card login-card">
                    <div class="card-header">
                        <h2>Student Login</h2>
                    </div>
                    <div class="card-body">
                        {% if msg %}
                        <div class="alert alert-danger text-center">
                            {{msg}}
                        </div>
                        {% endif %}
                        <form method="post">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label class="form-label">Username</label>
                                <input type="text" name="username" class="form-control" placeholder="Enter Username">
                            </div>
                            <div class="mb-4">
                                <label class="form-label">Password</label>
                                <input type="password" name="password" class="form-control" placeholder="Enter Password">
                            </div>
                            <div class="d-flex justify-content-center gap-3">
                                <button type="submit" formaction="/studentlogin/" class="btn btn-primary btn-login">Sign In</button>
                                <a href="/studentregisterpage/" class="btn btn-success btn-register">Sign Up</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
