<!DOCTYPE html>
<html>
<head>
    <title>Start Exam</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #eef2ff, #f8f9fa);
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
        }

        .navbar {
            background: linear-gradient(135deg, #0d6efd, #084298);
        }

        .exam-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.12);
        }

        .card-header {
            background: linear-gradient(135deg, #0d6efd, #084298);
            color: white;
            text-align: center;
            font-size: 28px;
            font-weight: 600;
            padding: 20px;
        }

        .card-body {
            padding: 35px;
        }

        .form-label {
            font-weight: 600;
        }

        .form-select {
            border-radius: 12px;
            padding: 12px;
        }

        .btn-start {
            width: 200px;
            height: 48px;
            border-radius: 12px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">
                OAEP Student Portal
            </a>
        </div>
    </nav>

    <div class="container mt-3">
        <div class="alert alert-primary shadow-sm">
            <h5 class="mb-0">
                Welcome, {{request.session.username}}
            </h5>
        </div>
    </div>
<div class="container mt-3">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h3>Select Subject</h3>
        </div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                <label class="form-label">Subject</label>

                <select class="form-select" name="subject">
                    {% for sub in subject %}
                    <option value="{{sub.sub_name}}">{{sub.sub_name}}</option>
                    {% endfor %}
                </select>
                <div class="mt-4 text-center">
                    <button type="submit" formaction="/startexam/" class="btn btn-success">Start Exam</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
