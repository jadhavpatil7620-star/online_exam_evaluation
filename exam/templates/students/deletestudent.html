<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Student</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
        }

        .navbar {
            background: linear-gradient(135deg, #dc3545, #b02a37);
        }

        .card {
            border: none;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.15);
        }

        .card-header {
            background: linear-gradient(135deg, #dc3545, #b02a37);
            color: white;
            text-align: center;
            font-size: 28px;
            font-weight: 600;
            padding: 18px;
        }

        .card-body {
            padding: 35px;
        }

        .form-label {
            font-weight: 600;
            color: #343a40;
        }

        .form-control {
            border-radius: 12px;
            padding: 12px;
        }

        .btn-delete {
            width: 200px;
            height: 48px;
            border-radius: 12px;
            font-weight: 600;
        }

        .warning-box {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                OAEP Admin Panel
            </a>
            <a href="/studentcurdpage/" class="btn btn-outline-light"><i class="bi bi-box-arrow-left">← Back</i></a>
        </div>
    </nav>

    <!-- Delete Student Form -->
    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-md-6">

                <div class="card">

                    <div class="card-header">
                        Delete Student
                    </div>

                    <div class="card-body">

                        {% if msg %}
                        <div class="alert alert-success text-center">
                            {{msg}}
                        </div>
                        {% endif %}

                        <form method="post">

                            {% csrf_token %}

                            <div class="mb-3">
                                <label class="form-label">
                                    Student Username
                                </label>

                                <input type="text"
                                       class="form-control"
                                       name="username"
                                       placeholder="Enter Student Username">
                            </div>

                            <div class="warning-box">
                                <strong>Warning!</strong><br>
                                Once deleted, student information cannot be recovered.
                            </div>

                            <div class="text-center mt-4">

                                <button type="submit"
                                        formaction="/deletestudent/"
                                        class="btn btn-danger btn-delete">
                                    Delete Student
                                </button>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
