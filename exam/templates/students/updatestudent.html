<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Student</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #eef2ff, #f8f9fa);
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
        }

        .navbar {
            background: linear-gradient(135deg, #0d6efd, #084298);
        }

        .card {
            border: none;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.12);
        }

        .card-header {
            background: linear-gradient(135deg, #0d6efd, #084298);
            color: white;
            text-align: center;
            font-size: 28px;
            font-weight: 600;
            padding: 18px;
        }

        .card-body {
            padding: 35px;
        }

        .form-label {
            font-weight: 600;
        }

        .form-control {
            border-radius: 12px;
            padding: 12px;
        }

        .btn-update {
            width: 200px;
            height: 48px;
            border-radius: 12px;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                OAEP Admin Panel
            </a>
            <a href="/adminpage/" class="btn btn-outline-light"><i class="bi bi-box-arrow-left">← Back</i></a>
        </div>
    </nav>

    <div class="container mt-5 mb-5">

        <div class="row justify-content-center">

            <div class="col-md-8">

                <div class="card">

                    <div class="card-header">
                        Update Student
                    </div>

                    <div class="card-body">

                        {% if msg %}
                        <div class="alert alert-success text-center">
                            {{msg}}
                        </div>
                        {% endif %}

                        <form method="post">
                            {% csrf_token %}

                            <div class="mb-3">
                                <label class="form-label">
                                    Username
                                </label>
                                <input type="text"
                                       class="form-control"
                                       name="username"
                                       value="{{userdb.username}}">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">
                                    Email Address
                                </label>
                                <input type="email"
                                       class="form-control"
                                       name="email"
                                       value="{{userdb.email}}">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">
                                    Mobile Number
                                </label>
                                <input type="text"
                                       class="form-control"
                                       name="mobile_no"
                                       value="{{userdb.mobile_no}}">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">
                                    Password
                                </label>
                                <input type="password"
                                       class="form-control"
                                       name="password"
                                       value="{{userdb.password}}">
                            </div>

                            <div class="text-center mt-4">

                                <button type="submit"
                                        formaction="/updatestudent/"
                                        class="btn btn-primary btn-update">
                                    Update Student
                                </button>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
