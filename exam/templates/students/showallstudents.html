<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Students</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f7fc;
            font-family: 'Segoe UI', sans-serif;
        }

        .navbar {
            background: linear-gradient(135deg, #0d6efd, #084298);
        }

        .page-header {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-top: 30px;
            margin-bottom: 25px;
            box-shadow: 0px 5px 15px rgba(0,0,0,0.08);
        }

        .table-container {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0px 5px 15px rgba(0,0,0,0.08);
        }

        .table th {
            background: #0d6efd;
            color: white;
            text-align: center;
        }

        .btn-action {
            width: 80px;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-dark">
        <div class="container">
            <span class="navbar-brand fw-bold">
                OAEP Admin Panel
            </span>
            <a href="/studentcurdpage/" class="btn btn-outline-light"><i class="bi bi-box-arrow-left">← Back</i></a>
        </div>
    </nav>

    <div class="container">

        <div class="page-header d-flex justify-content-between align-items-center">

            <div>
                <h2>Student Management</h2>
                <p class="text-muted mb-0">
                    View all registered students
                </p>
            </div>

            <a href="/studentregisterpage/"
               class="btn btn-success">
                + Add Student
            </a>

        </div>

        <div class="table-container">

            <table class="table table-bordered table-hover">

                <thead>
                    <tr>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Mobile Number</th>
                        <th width="280">Actions</th>
                    </tr>
                </thead>

                <tbody>

                    {% for stud in userdb %}

                    <tr>

                        <td>{{stud.username}}</td>

                        <td>{{stud.email}}</td>

                        <td>{{stud.mobile_no}}</td>

                        <td class="text-center">

                            <a href="/viewstudentpage/"
                               class="btn btn-primary btn-sm btn-action">
                                View
                            </a>

                            <a href="/updatestudentpage/"
                               class="btn btn-warning btn-sm btn-action">
                                Update
                            </a>

                            <a href="/deletestudentpage/"
                               class="btn btn-danger btn-sm btn-action">
                                Delete
                            </a>

                        </td>

                    </tr>

                    {% empty %}

                    <tr>
                        <td colspan="5" class="text-center text-danger">
                            No Students Found
                        </td>
                    </tr>

                    {% endfor %}

                </tbody>

            </table>

        </div>

    </div>

</body>

</html>
