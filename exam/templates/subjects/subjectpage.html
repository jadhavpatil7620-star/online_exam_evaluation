<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subject Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f4f7fc;
            font-family:'Segoe UI',sans-serif;
        }

        .navbar{
            background:linear-gradient(135deg,#0d6efd,#084298);
        }

        .page-card{
            border:none;
            border-radius:20px;
            overflow:hidden;
            box-shadow:0 10px 25px rgba(0,0,0,.12);
        }

        .card-header-custom{
            background:linear-gradient(135deg,#0d6efd,#084298);
            color:white;
            padding:20px;
        }

        .table th{
            background:#0d6efd;
            color:white;
            vertical-align:middle;
        }

        .table tbody tr:hover{
            background:#f8f9fa;
        }

        .subject-count{
            background:white;
            border-radius:15px;
            padding:20px;
            text-align:center;
            box-shadow:0 5px 15px rgba(0,0,0,.08);
        }

        .subject-count h2{
            color:#0d6efd;
            font-weight:bold;
        }

        .btn-custom{
            border-radius:10px;
        }

        @media(max-width:768px){

            .header-actions{
                margin-top:15px;
            }

            .subject-count{
                margin-bottom:20px;
            }

            .table{
                font-size:14px;
            }
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark">
    <div class="container">

        <a class="navbar-brand fw-bold">
            OAEP Subject Management
        </a>

        <a href="/adminpage/"
           class="btn btn-light">
            Dashboard
        </a>

    </div>
</nav>

<div class="container mt-4">

    <div class="row mb-4">

        <div class="col-lg-3">

            <div class="subject-count">
                <h2>{{subjectdb|length}}</h2>
                <h6>Total Subjects</h6>
            </div>

        </div>

        <div class="col-lg-9">

            <div class="d-flex flex-wrap justify-content-end gap-2 header-actions">

                <input type="text"
                       class="form-control w-auto"
                       placeholder="Search Subject">

                <a href="/addsubject/"
                   class="btn btn-success btn-custom">
                    + Add Subject
                </a>

                <a href="/adminpage/"
                   class="btn btn-secondary btn-custom">
                    Back
                </a>

            </div>

        </div>

    </div>

    <div class="card page-card">

        <div class="card-header-custom">

            <h3 class="mb-0">
                Subject List
            </h3>

        </div>

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead>

                        <tr>
                            <th>ID</th>
                            <th>Subject Name</th>
                            <th width="200">Actions</th>
                        </tr>

                    </thead>

                    <tbody>

                        {% for sub in subjectdb %}

                        <tr>

                            <td>{{forloop.counter}}</td>

                            <td>
                                {{sub.sub_name}}
                            </td>

                            <td>

                                <a href="#"
                                   class="btn btn-warning btn-sm">
                                    Edit
                                </a>

                                <a href="#"
                                   class="btn btn-danger btn-sm">
                                    Delete
                                </a>

                            </td>

                        </tr>

                        {% endfor %}

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

</body>
</html>
