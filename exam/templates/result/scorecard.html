<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Result</title>

    {% load static %}

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f7fc;
            font-family: 'Segoe UI', sans-serif;
        }

        .navbar {
            background: linear-gradient(135deg, #0d6efd, #084298);
        }

        .result-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.12);
            padding: 30px;
            margin-top: 30px;
        }

        .score-box {
            background: linear-gradient(135deg, #198754, #157347);
            color: white;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            margin-bottom: 25px;
        }

        .score-box h2 {
            margin: 0;
            font-weight: bold;
        }

        .table th {
            background: #0d6efd;
            color: white;
            text-align: center;
        }

        .table td {
            vertical-align: middle;
        }

        .correct {
            color: green;
            font-weight: bold;
        }

        .wrong {
            color: red;
            font-weight: bold;
        }

        .logout-btn {
            border-radius: 10px;
        }
    </style>

</head>

<body>

    <nav class="navbar navbar-dark">
        <div class="container">

            <span class="navbar-brand fw-bold">
                OAEP Examination Result
            </span>

            <a href="/logout"
               class="btn btn-light logout-btn">
                Logout
            </a>

        </div>
    </nav>

    <div class="container">

        <div class="result-card">

            <h3 class="mb-4">
                Welcome, {{request.session.username}}
            </h3>

            <div class="score-box">
                <h2>Final Score : {{finalscore}}</h2>
            </div>

            <table class="table table-bordered table-hover">

                <thead>
                    <tr>
                        <th>Q No</th>
                        <th>Question</th>
                        <th>Your Answer</th>
                        <th>Correct Answer</th>
                    </tr>
                </thead>

                <tbody>

                    {% for res in response %}

                    <tr>

                        <td>{{res.0}}</td>

                        <td>{{res.1}}</td>

                        <td>
                            {% if res.2 == res.3 %}
                                <span class="correct">
                                    {{res.2}}
                                </span>
                            {% else %}
                                <span class="wrong">
                                    {{res.2}}
                                </span>
                            {% endif %}
                        </td>

                        <td>
                            <span class="correct">
                                {{res.3}}
                            </span>
                        </td>

                    </tr>

                    {% endfor %}

                </tbody>

            </table>

        </div>

    </div>

</body>

</html>
