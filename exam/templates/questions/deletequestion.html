<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Question</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
        }

        .navbar {
            background: linear-gradient(135deg, #dc3545, #b02a37);
        }

        .card {
            border: none;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.15);
        }

        .card-header {
            background: linear-gradient(135deg, #dc3545, #b02a37);
            color: white;
            font-size: 28px;
            font-weight: 600;
            text-align: center;
            padding: 18px;
        }

        .card-body {
            padding: 30px;
        }

        .form-label {
            font-weight: 600;
        }

        .form-control {
            border-radius: 10px;
            padding: 12px;
        }

        .btn-delete {
            width: 180px;
            border-radius: 10px;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                OAEP Admin Panel
            </a>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">

            <div class="col-md-6">

                <div class="card">

                    <div class="card-header">
                        Delete Question
                    </div>
                    {% if msg %}
                    <div class="alert alert-success text-center">
                        {{msg}}
                    </div>
                    {% endif %}

                    <div class="card-body">

                        <form method="get">

                            <div class="mb-3">
                                <label class="form-label">
                                    Question ID
                                </label>

                                <input type="number" class="form-control" name="qid" placeholder="Enter Question ID">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">
                                    Subject Name
                                </label>

                                <input type="text" class="form-control" name="subject" placeholder="Enter Subject Name">
                            </div>

                            <div class="alert alert-warning text-center">
                                <strong>Warning!</strong><br>
                                Deleted questions cannot be recovered.
                            </div>

                            <div class="text-center mt-4">

                                <button type="submit" formaction="/deletequestion" class="btn btn-danger btn-delete">
                                    Delete Question
                                </button>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>
    </div>

</body>

</html>
