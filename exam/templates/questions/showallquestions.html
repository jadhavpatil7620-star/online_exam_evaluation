<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question Bank</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f7fc;
            font-family: 'Segoe UI', sans-serif;
        }

        .navbar {
            background: linear-gradient(135deg, #0d6efd, #084298);
        }

        .page-header {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-top: 30px;
            margin-bottom: 25px;
            box-shadow: 0px 5px 15px rgba(0,0,0,0.08);
        }

        .table-container {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0px 5px 15px rgba(0,0,0,0.08);
        }

        .table th {
            background: #0d6efd;
            color: white;
            text-align: center;
            vertical-align: middle;
        }

        .table td {
            vertical-align: middle;
        }

        .btn-action {
            width: 80px;
        }

        .question-text {
            max-width: 300px;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                OAEP Admin Panel
            </a>
            <a href="/questioncurdpage/" class="btn btn-outline-light"><i class="bi bi-box-arrow-left">← Back</i></a>
        </div>
    </nav>

    <div class="container">

        <div class="page-header d-flex justify-content-between align-items-center">
            <div>
                <h2>Question Bank</h2>
                <p class="text-muted mb-0">
                    Manage all examination questions
                </p>
            </div>

            <a href="/addquestion" class="btn btn-success">
                + Add Question
            </a>
        </div>

        <div class="table-container">

            <table class="table table-bordered table-hover">

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Subject</th>
                        <th>Question</th>
                        <th>Correct Answer</th>
                        <th width="280">Actions</th>
                    </tr>
                </thead>

                <tbody>

                    {% for q in quedb %}

                    <tr>

                        <td class="text-center">
                            {{q.que_id}}
                        </td>

                        <td>
                            {{q.sub_name}}
                        </td>

                        <td class="question-text">
                            {{q.que_name}}
                        </td>

                        <td>
                            <span class="badge bg-success">
                                {{q.correct_ans}}
                            </span>
                        </td>

                        <td class="text-center">

                            <a href="/viewquestion?qid={{q.que_id}}&subject={{q.sub_name}}"
                               class="btn btn-primary btn-sm btn-action">
                                View
                            </a>

                            <a href="/updatequestionpage?qid={{q.que_id}}"
                               class="btn btn-warning btn-sm btn-action">
                                Update
                            </a>

                            <a href="/deletequestion?qid={{q.que_id}}&subject={{q.sub_name}}"
                               class="btn btn-danger btn-sm btn-action">
                                Delete
                            </a>

                        </td>

                    </tr>

                    {% endfor %}

                </tbody>

            </table>

        </div>

    </div>

</body>

</html>
