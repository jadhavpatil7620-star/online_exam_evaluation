<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Questions</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #e8f0ff, #f8f9fa);
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
        }

        .navbar {
            background: linear-gradient(135deg, #0d6efd, #084298) !important;
            box-shadow: 0px 3px 15px rgba(0, 0, 0, 0.15);
        }

        .navbar-brand {
            font-size: 22px;
            font-weight: 600;
        }

        .card {
            border: none;
            border-radius: 20px;
            overflow: hidden;
            background: #fff;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.12);
        }

        .card-header {
            background: linear-gradient(135deg, #0d6efd, #084298);
            color: white;
            font-size: 28px;
            font-weight: 600;
            text-align: center;
            padding: 18px;
        }

        .card-body {
            padding: 30px;
        }

        .form-label {
            font-weight: 600;
            color: #343a40;
        }

        .form-control {
            border-radius: 12px;
            padding: 12px;
            border: 1px solid #ced4da;
        }

        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 10px rgba(13, 110, 253, .25);
        }

        .btn-save {
            width: 200px;
            height: 45px;
            border-radius: 12px;
            font-weight: 600;
            letter-spacing: .5px;
        }

        .btn-save:hover {
            transform: translateY(-2px);
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                OAEP Admin Panel
            </a>
        </div>
    </nav>

    <!-- Main Card -->
    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8">

                <div class="card">

                    <div class="card-header">
                        View Question
                    </div>

                    <div class="card-body">

                        <form method="get">

                            <!-- Question ID -->
                            <div class="mb-3">
                                <label class="form-label fw-bold">Question ID</label>
                                <input type="number"
                                    class="form-control"
                                    name="qid"
                                    value="{{quedb.que_id}}"
                                    placeholder="Enter Question ID">
                            </div>

                            <!-- Subject -->
                            <div class="mb-3">
                                <label class="form-label fw-bold">Subject Name</label>
                                <input type="text"
                                    class="form-control"
                                    name="subject"
                                    value="{{quedb.sub_name}}"
                                    placeholder="Enter Subject Name">
                            </div>

                            <!-- Question -->
                            <div class="mb-3">
                                <label class="form-label fw-bold">Question</label>
                                <input class="form-control"
                                    name="question"
                                    value="{{quedb.que_name}}"
                                    placeholder="Enter Question">
                            </div>

                            <!-- Option A -->
                            <div class="mb-3">
                                <label class="form-label fw-bold">Option A</label>
                                <input type="text"
                                    value="{{quedb.option_1}}"
                                    name="opt1"
                                    class="form-control">
                            </div>

                            <!-- Option B -->
                            <div class="mb-3">
                                <label class="form-label fw-bold">Option B</label>
                                <input type="text"
                                    value="{{quedb.option_2}}"
                                    name="opt2"
                                    class="form-control">
                            </div>

                            <!-- Option C -->
                            <div class="mb-3">
                                <label class="form-label fw-bold">Option C</label>
                                <input type="text"
                                    value="{{quedb.option_3}}"
                                    name="opt3"
                                    class="form-control">
                            </div>

                            <!-- Option D -->
                            <div class="mb-3">
                                <label class="form-label fw-bold">Option D</label>
                                <input type="text"
                                    value="{{quedb.option_4}}"
                                    name="opt4"
                                    class="form-control">
                            </div>

                            <!-- Correct Answer -->
                            <div class="mb-3">
                                <label class="form-label fw-bold">Correct Answer</label>
                                <input type="text"
                                    value="{{quedb.correct_ans}}"
                                    class="form-control"
                                    name="rightans"
                                    placeholder="Enter Correct Answer">
                            </div>

                            <!-- Button -->
                            <div class="text-center mt-4">
                                <button type="submit"
                                    formaction="/viewquestion"
                                    class="btn btn-primary btn-save">
                                    View Question
                                </button>
                            </div>

                        </form>

                    </div>

                </div>

            </div>
        </div>
    </div>

</body>

</html>
