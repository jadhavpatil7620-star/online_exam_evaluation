<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #eef2ff, #f8f9fa);
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
        }

        .navbar {
            background: linear-gradient(135deg, #0d6efd, #084298);
        }

        .page-title {
            text-align: center;
            margin-top: 40px;
            margin-bottom: 40px;
            font-weight: bold;
            color: #084298;
        }

        .crud-card {
            border: none;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.12);
            transition: 0.3s;
        }

        .crud-card:hover {
            transform: translateY(-8px);
        }

        .card-body {
            text-align: center;
            padding: 35px;
        }

        .icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .btn-custom {
            width: 150px;
            border-radius: 10px;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/home/">
                OAEP Admin Panel
            </a>
        </div>
    </nav>

    <div class="container">
        <h2 class="page-title">
            All Management Panel
        </h2>
        <div class="row g-4" style="margin-left: 20px;">
            <div class="col-md-6 col-lg-3">
                <div class="card crud-card">
                    <div class="card-body">
                        <div class="icon">👤</div>
                        <h4>Student Operations</h4>
                        <p>
                            All student operations are here.
                        </p>
                        <a href="/studentloginpage/" class="btn btn-primary btn-custom">
                            Students
                        </a>
                    </div>
                </div>
            </div>

            <div class="col-md-6 col-lg-3">
                <div class="card crud-card">
                    <div class="card-body">
                        <div class="icon">❓</div>
                        <h4>Question Operations</h4>
                        <p>
                            All question operations here.
                        </p>
                        <a href="/studentloginpage/" class="btn btn-primary btn-custom">
                            Questions
                        </a>
                    </div>
                </div>
            </div>

            <div class="col-md-6 col-lg-3">
                <div class="card crud-card">
                    <div class="card-body">
                        <div class="icon">📚</div>
                        <h4>Results Operations</h4>
                        <p>
                            All result operations here.
                        </p>
                        <a href="/studentregisterpage/" class="btn btn-primary btn-custom">
                            Results
                        </a>
                    </div>
                </div>
            </div>

        </div>
    </div>
</body>
</html>
